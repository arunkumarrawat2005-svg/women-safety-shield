services:
  # ==========================================================
  # Women Safety Shield - Web & WebSocket ASGI Service
  # ==========================================================
  - type: web
    name: women-safety-shield
    runtime: python
    plan: free
    region: singapore # or oregon, frankfurt, ohio
    buildCommand: "./build.sh"
    startCommand: "daphne --proxy-headers -b 0.0.0.0 -p $PORT women_safety_shield.women_safety_shield.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wss-postgres
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

# ==========================================================
# Managed PostgreSQL Database (Render Free Tier)
# ==========================================================
databases:
  - name: wss-postgres
    plan: free
    region: singapore # Match web service region
    databaseName: wss
    user: wss_admin
