plugins {
    id 'com.android.application'
}

android {
    namespace 'org.womensafety.shield'
    compileSdk 34

    defaultConfig {
        applicationId "org.womensafety.shield"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.5.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero heavy dependencies required for ultra-fast startup and lightweight APK
}
