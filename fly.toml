# fly.toml app configuration file for Women Safety Shield ASGI WebSockets
app = "women-safety-shield-ws"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.asgi"

[env]
  DJANGO_SETTINGS_MODULE = "women_safety_shield.women_safety_shield.settings"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
